services:
  # 1. PostgreSQL Database (Internal only, zero exposed host ports)
  db:
    container_name: zyven-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zyven_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-zyven_prod}
    volumes:
      - /mnt/data/postgres:/var/lib/postgresql/data
    networks:
      - zyven-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-zyven_app} -d $${POSTGRES_DB:-zyven_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Prisma Migrator (Run-once initialization & schema migrations)
  migrate:
    image: ${ECR_REGISTRY:-532787445442.dkr.ecr.ap-south-1.amazonaws.com}/zyven:${MIGRATOR_TAG:-migrator-58d2dff}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    networks:
      - zyven-internal
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. Next.js 14 Production App (Standalone, pinned by immutable tag/digest)
  app:
    container_name: zyven-app
    image: ${ECR_REGISTRY:-532787445442.dkr.ecr.ap-south-1.amazonaws.com}/zyven:${APP_TAG:-app-58d2dff}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      ENABLE_DEMO_LOGIN: "false"
      ALLOW_PROD_SEED: "false"
    networks:
      - zyven-internal
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"status\":\"healthy\"' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 800M
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "5"

  # 4. Cloudflare Tunnel Daemon (Outbound-only secure ingress)
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - zyven-internal
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  zyven-internal:
    driver: bridge
